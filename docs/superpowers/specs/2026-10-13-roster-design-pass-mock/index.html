<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roster design mock (reference)</title>
<style>
@font-face { font-family: 'Oswald Variable'; src: url(oswald.woff2) format('woff2'); font-weight: 200 700; font-display: swap; }

:root {
  color-scheme: dark;
  --obsidian: #050a08; --pitch: #07110d; --basalt: #0b1511; --basalt-2: #0e1c16;
  --ash: #26372f; --ash-2: #3a5246; --bone: #e8efe9; --smoke: #96a59c;
  --drake: #59d66c; --gold: #dfb85b; --averland: #fdb825; --ember: #ff6a2b; --magma: #e0431d;
  --font-display: 'Oswald Variable', 'Bahnschrift', 'DIN Condensed', 'Oswald', 'Arial Narrow', system-ui, sans-serif;
  --font-sans: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'Cascadia Code', 'Cascadia Mono', ui-monospace, Consolas, monospace;
  --pour: 110ms; /* delay between ranks lighting up */
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; background: var(--obsidian); color: var(--bone); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background:
    radial-gradient(70% 55% at 50% 112%, rgba(224, 67, 29, 0.30), transparent 62%),
    radial-gradient(100% 70% at 50% -12%, rgba(89, 214, 108, 0.05), transparent 62%),
    linear-gradient(180deg, var(--obsidian), var(--pitch)); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--drake); outline-offset: 2px; border-radius: 2px; }

/* fake nav, only for context */
.nav { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: center; gap: 1.6rem; height: 3.1rem; background: rgba(5, 10, 8, 0.82); backdrop-filter: blur(8px); border-bottom: 1px solid var(--ash); font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.78rem; color: var(--smoke); }
.nav b { color: var(--bone); letter-spacing: 0.16em; font-size: 0.95rem; }
.nav .on { color: var(--drake); border-bottom: 2px solid var(--ember); padding: 0.9rem 0 0.6rem; }
@media (max-width: 720px) { .nav span:not(.on) { display: none; } }

.page { max-width: 72rem; margin: 0 auto; padding: 3rem 1.5rem 5rem; }

/* ---------- page header ---------- */
.eyebrow { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.28em; font-size: 0.72rem; color: var(--smoke); margin: 0 0 0.8rem; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em; line-height: 1; font-size: clamp(2.4rem, 6vw, 3.6rem); }
.lede { margin: 0.9rem 0 0; color: #c3d0c6; max-width: 52ch; line-height: 1.55; }
.status { display: flex; flex-wrap: wrap; gap: 0.35rem 1.2rem; margin: 1.4rem 0 0; padding: 0; list-style: none; font-family: var(--font-mono); font-size: 0.78rem; color: var(--smoke); }
.status li + li::before { content: ''; display: inline-block; width: 5px; height: 5px; margin: 0 1.1rem 0.12rem -0.1rem; background: var(--ash-2); transform: rotate(45deg); }
.status a, .status button { all: unset; cursor: pointer; color: var(--gold); border-bottom: 1px dotted rgba(223, 184, 91, 0.6); }
.status a:hover, .status button:hover { color: var(--bone); }
.status a:focus-visible, .status button:focus-visible { outline: 2px solid var(--drake); outline-offset: 3px; }
.status .when { margin-left: auto; }

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.7rem; margin-top: 1.4rem; }
.btn { display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; font-size: 0.85rem; padding: 0.55rem 0.95rem; background: transparent; border: 1px solid var(--ash-2); color: var(--smoke); transition: background 0.2s, border-color 0.2s, color 0.2s; }
.btn:hover { color: var(--bone); border-color: var(--smoke); }
.btn.find { color: var(--drake); background: rgba(89, 214, 108, 0.06); border-color: rgba(89, 214, 108, 0.4); }
.btn.find:hover { background: rgba(89, 214, 108, 0.12); border-color: rgba(89, 214, 108, 0.75); }
.btn svg { width: 1rem; height: 1rem; }
.btn[aria-pressed='true'] { color: var(--bone); border-color: var(--gold); }
.spacer { flex: 1; }
.findmsg { font-family: var(--font-mono); font-size: 0.76rem; color: var(--averland); min-height: 1.2rem; margin: 0.6rem 0 0; }

/* ---------- surfaces ---------- */
.surface { background: linear-gradient(180deg, rgba(14, 28, 22, 0.86), rgba(9, 18, 14, 0.9)); border: 1px solid var(--ash); backdrop-filter: blur(8px); }

/* ---------- High Command dais ---------- */
.dais { position: relative; margin-top: 2rem; padding: 1.7rem 1.8rem 1.8rem; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.4fr); gap: 1.6rem 2.4rem; border-radius: 3px; }
.dais::before { content: ''; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold) 30%, #f2d27a 50%, var(--gold) 70%, transparent); }
.dais::after { content: ''; position: absolute; left: 10%; right: 10%; top: 0; height: 90px; background: radial-gradient(60% 100% at 50% 0, rgba(223, 184, 91, 0.12), transparent); pointer-events: none; }
.dais-label { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.22em; font-size: 0.68rem; color: var(--gold); margin: 0 0 0.9rem; }
.hero { display: flex; align-items: center; gap: 1rem; }
.hero .av { width: 4.2rem; height: 4.2rem; font-size: 1.3rem; border-color: rgba(223, 184, 91, 0.55); }
.hero-name { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.7rem, 3.6vw, 2.3rem); line-height: 1.05; }
.hero-rank { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.85rem; color: var(--gold); margin-bottom: 0.3rem; }
.court { display: grid; gap: 0.9rem; align-content: start; border-left: 1px solid rgba(223, 184, 91, 0.25); padding-left: 2.2rem; }
.court .rk { grid-template-columns: 8.5rem 1fr; }
.court .rk-l { color: var(--gold); }
@media (max-width: 800px) { .dais { grid-template-columns: 1fr; padding: 1.4rem 1.2rem; } .court { border-left: 0; padding-left: 0; border-top: 1px solid rgba(223, 184, 91, 0.25); padding-top: 1.1rem; } }

/* ---------- member chip ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 0.38rem; margin: 0; padding: 0; list-style: none; }
.m { position: relative; display: inline-flex; align-items: center; gap: 0.5rem; max-width: 100%; padding: 0.2rem 0.65rem 0.2rem 0.2rem; background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(58, 82, 70, 0.55); border-radius: 999px; font-size: 0.86rem; line-height: 1.2; transition: border-color 0.15s, background 0.15s; }
.m:hover { border-color: rgba(89, 214, 108, 0.55); background: rgba(89, 214, 108, 0.06); }
.av { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; font-family: var(--font-display); font-weight: 600; font-size: 0.62rem; letter-spacing: 0.02em; color: #cfe0d4; background: linear-gradient(180deg, #2c4137, #1a2a22); border: 1px solid rgba(58, 82, 70, 0.9); }
.av { position: relative; overflow: hidden; }
.avimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.nm { font-weight: 600; color: #e1ebe3; overflow-wrap: anywhere; }
.tag { font-family: var(--font-mono); font-size: 0.62rem; color: var(--smoke); border: 1px solid var(--ash); border-radius: 3px; padding: 0 0.3rem; }
.b { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.06rem 0.38rem; border-radius: 3px; white-space: nowrap; }
.b.act { color: #1a1204; background: var(--averland); font-weight: 700; }
.b.warn { color: #ffd2a8; border: 1px solid rgba(255, 106, 43, 0.6); background: rgba(255, 106, 43, 0.12); }
.b.bot { color: var(--smoke); border: 1px solid var(--ash-2); }
.m.me { border-color: var(--drake); box-shadow: 0 0 0 1px rgba(89, 214, 108, 0.3), 0 0 18px -4px rgba(89, 214, 108, 0.55); }
.m.me::after { content: 'You'; font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: #06150a; background: var(--drake); padding: 0.06rem 0.38rem; border-radius: 3px; font-weight: 700; }
.m.ping { animation: ping 1.4s ease-out 2; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(89, 214, 108, 0.7); } 100% { box-shadow: 0 0 0 14px rgba(89, 214, 108, 0); } }

/* rank row: label left, members right */
.rk { display: grid; grid-template-columns: 10rem 1fr; gap: 0.35rem 0.9rem; align-items: start; }
.rk-l { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.09em; font-size: 0.82rem; color: #b9c7bd; padding-top: 0.38rem; display: flex; gap: 0.5rem; align-items: baseline; margin: 0; font-weight: 500; }
.rk-l .n { font-family: var(--font-mono); font-size: 0.68rem; color: var(--smoke); letter-spacing: 0; }

/* ---------- branch ---------- */
.branches { margin-top: 2.2rem; display: grid; gap: 0.55rem; }
.branch { border-radius: 3px; transition: border-color 0.25s, box-shadow 0.35s; }
.branch:not([data-static]):hover { border-color: rgba(89, 214, 108, 0.45); }
.branch[data-open] { border-color: rgba(255, 106, 43, 0.5); box-shadow: 0 0 40px -18px rgba(255, 106, 43, 0.55); }
.branch.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px rgba(223, 184, 91, 0.7); } 100% { box-shadow: 0 0 0 3px rgba(223, 184, 91, 0); } }

.bar { position: relative; display: grid; grid-template-columns: 2.9rem minmax(10.5rem, 1fr) minmax(0, 1.8fr) 3.6rem; align-items: center; gap: 1rem; padding: 0.8rem 1rem; }
.sigil { display: inline-flex; align-items: center; justify-content: center; width: 2.9rem; height: 2.9rem; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--gold); background: linear-gradient(180deg, rgba(223, 184, 91, 0.16), rgba(223, 184, 91, 0.03)); clip-path: polygon(15% 0, 85% 0, 100% 50%, 85% 100%, 15% 100%, 0 50%); box-shadow: inset 0 0 0 1px rgba(223, 184, 91, 0.4); }
.branch[data-open] .sigil { color: #ffd98a; background: linear-gradient(180deg, rgba(255, 106, 43, 0.28), rgba(223, 184, 91, 0.05)); }
.t { margin: 0; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; font-size: 1.12rem; line-height: 1.1; }
.t-sub { font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--smoke); margin-top: 0.3rem; }
.bar-btn { all: unset; cursor: pointer; display: block; }
.bar-btn::after { content: ''; position: absolute; inset: 0; }   /* the whole bar is the click target */
.bar-btn:focus-visible::after { outline: 2px solid var(--drake); outline-offset: -2px; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.8rem; min-width: 0; }
.head-l { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--smoke); width: 100%; margin-bottom: -0.1rem; }
.head .m { position: relative; z-index: 1; }
.more { font-family: var(--font-mono); font-size: 0.72rem; color: var(--smoke); }
.vacant { display: inline-flex; align-items: center; gap: 0.55rem; color: #ff9a7a; font-style: italic; font-size: 0.9rem; }
.vacant svg { width: 1.7rem; height: 1.7rem; }
.tail { display: flex; align-items: center; justify-content: flex-end; gap: 0.6rem; font-family: var(--font-mono); font-size: 0.82rem; color: var(--smoke); }
.chev { width: 1rem; height: 1rem; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.2s; }
.branch[data-open] .chev { transform: rotate(180deg); color: var(--ember); }
.branch:hover .chev { color: var(--drake); }
.branch[data-static] .chev { visibility: hidden; }
.branch[data-static] .t { color: #cfdad2; }
.branch[data-static] .bar-btn { cursor: default; }
@media (max-width: 760px) {
  .bar { grid-template-columns: 2.6rem 1fr auto; gap: 0.5rem 0.8rem; padding: 0.75rem 0.8rem; }
  .sigil { width: 2.6rem; height: 2.6rem; }
  .head { grid-column: 1 / -1; padding-left: 0; }
  .tail { grid-column: 3; grid-row: 1; }
}

/* collapse: CSS only, content stays in the DOM */
.body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.34s cubic-bezier(0.2, 0.8, 0.2, 1); }
.branch[data-open] .body { grid-template-rows: 1fr; }
.body-in { min-height: 0; overflow: hidden; visibility: hidden; transition: visibility 0s 0.34s; }
.branch[data-open] .body-in { visibility: visible; transition-delay: 0s; }
/* bulk and programmatic opens skip the height animation; the spine still pours */
.instant .body, .instant .body-in { transition: none !important; }

/* ---------- ladder + heat spine (the signature) ---------- */
.ladder { position: relative; padding: 0.5rem 1.3rem 1.3rem; border-top: 1px solid rgba(58, 82, 70, 0.5); }
.rg { position: relative; padding: 0.42rem 0 0.42rem 2.1rem; --node-y: 0.95rem; }
/* segment of spine from this node down to the next */
.rg::before { content: ''; position: absolute; left: 0.6rem; width: 3px; margin-left: -1.5px; border-radius: 2px; box-shadow: 0 0 10px -1px var(--hn); top: 0; bottom: 0;
  background: linear-gradient(to bottom, var(--hp) 0, var(--h) var(--node-y), var(--hn) 100%);
  transform: scaleY(0); transform-origin: top; transition: transform 0.12s linear; }
.rg.last::before { bottom: auto; height: var(--node-y); }
.branch[data-open] .rg::before { transform: scaleY(1); transition-duration: 0.18s; transition-delay: calc(var(--s) * var(--pour) + 40ms); }
.node { position: absolute; left: 0.6rem; top: var(--node-y); width: 11px; height: 11px; background: var(--h); transform: translate(-50%, -50%) rotate(45deg) scale(0); transition: transform 0.15s, box-shadow 0.2s; }
.branch[data-open] .node { transform: translate(-50%, -50%) rotate(45deg) scale(1); box-shadow: 0 0 12px 1px var(--h); transition: transform 0.32s cubic-bezier(0.3, 1.7, 0.5, 1), box-shadow 0.5s; transition-delay: calc(var(--s) * var(--pour) + 90ms); }
.rg.lat { padding-left: 3.6rem; }
.rg.lat .node { left: 2.2rem; width: 8px; height: 8px; background: var(--obsidian); border: 1.5px solid var(--h); box-shadow: none; }
.branch[data-open] .rg.lat .node { box-shadow: 0 0 8px -1px var(--h); }
.rg.lat::after { content: ''; position: absolute; left: 0.6rem; width: 1.6rem; top: var(--node-y); border-top: 1.5px dashed var(--h); opacity: 0.8; }
.rg.lat .rk-l { color: var(--smoke); }
.rg.lat .rk { grid-template-columns: 8.4rem 1fr; }
.peers { display: flex; flex-wrap: wrap; gap: 0.4rem 2.6rem; }
.peers .rk { grid-template-columns: auto auto; }
.peers .rk:first-child .rk-l { width: 10rem; }
.peers .rk-l { white-space: nowrap; }
.aside { position: relative; margin: 0.2rem 0; padding: 0.55rem 0.8rem; border: 1px dashed rgba(223, 184, 91, 0.45); border-radius: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; background: rgba(223, 184, 91, 0.04); }
.aside-l { font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.no-spine .rg::before, .no-spine .node { display: none; }
.no-spine .rg { padding-left: 0; }

@media (max-width: 760px) {
  .ladder { padding: 0.4rem 0.8rem 1rem; }
  .rg { padding-left: 1.7rem; }
  .rk, .peers .rk, .rg.lat .rk, .court .rk { grid-template-columns: 1fr; }
  .peers .rk:first-child .rk-l { width: auto; }
  .rk-l { padding-top: 0.1rem; }
  .rg.lat { padding-left: 3rem; }
  .rg.lat .node { left: 1.8rem; }
  .rg.lat::after { width: 1.2rem; }
}

/* ---------- servitors, infirmary ---------- */
.srv { margin-top: 2.6rem; padding-top: 1.2rem; border-top: 1px solid var(--ash); }
.srv h2 { margin: 0; font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.9rem; color: var(--smoke); }
.srv h2 { margin-bottom: 0.8rem; }
.srv .m { filter: grayscale(1); opacity: 0.78; }
.inf { margin-top: 2rem; padding: 1.4rem 1.5rem; border-radius: 3px; }
.inf h2 { margin: 0; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; font-size: 1.4rem; }
.inf .sub { font-family: var(--font-mono); font-size: 0.74rem; color: var(--smoke); margin: 0.3rem 0 1rem; }
.inf-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.8rem; padding: 0.4rem 0; border-top: 1px solid rgba(58, 82, 70, 0.4); }
.inf-row .rk-r { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.74rem; color: var(--smoke); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .branch[data-open] .rg::before { transform: scaleY(1); }
}
</style>
</head>
<body>
<div class="nav"><b>◆ SALAMANDERS</b><span>Home</span><span>Perk Builder</span><span>Armoury</span><span>Builds</span><span>Companies</span><span>Ranks</span><span class="on">Roster</span></div>
<main class="page" id="app"></main>

<script>
const ORD = ['', '1st', '2nd', '3rd', '4th', '5th', '6th', '7th']
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII']
const SIGIL = { forge: 'M', librarius: 'L', apothecarion: 'A', reclusiam: 'R', 'venerable-dreadnoughts': 'VD' }
const SUB = { company: 'Company', dreadnoughts: 'Honoured', specialty: 'Specialty' }
const STOPS = [[0, [242, 210, 122]], [0.4, [255, 106, 43]], [0.72, [224, 67, 29]], [1, [58, 82, 70]]]
const ICON_CHEV = '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l5 5 5-5"/></svg>'
const ICON_FIND = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="4.2"/><path d="M8 0.8v3M8 12.2v3M0.8 8h3M12.2 8h3"/></svg>'
const ICON_VACANT = '<svg viewBox="0 0 32 32"><polygon points="8,3 24,3 30,16 24,29 8,29 2,16" fill="none" stroke="#ff9a7a" stroke-width="1.6" stroke-dasharray="3 3"/></svg>'

const heat = (t) => {
  t = Math.max(0, Math.min(1, t))
  for (let i = 1; i < STOPS.length; i++) {
    if (t <= STOPS[i][0]) {
      const [t0, a] = STOPS[i - 1], [t1, b] = STOPS[i], k = (t - t0) / (t1 - t0)
      return `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * k)).join(',')})`
    }
  }
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const initials = (n) => esc(n.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => [...w][0]).join('').toUpperCase())

let DATA, INF, VIEWER, OPEN = new Set(), showInf = false
const Q = new URLSearchParams(location.search), IMG = Q.get("img"), DEC = Q.get("dec") || "auto", RUN = Q.get("r") || "0"
let imgN = 0, deferImgs = false
const avatar = (name) => IMG ? `<span class="av" aria-hidden="true">${initials(name)}<img class="avimg" ${IMG === "onopen" && deferImgs ? "data-src" : "src"}="av/${(imgN++) % 220}.png?r=${RUN}" width="64" height="64" alt="" ${IMG === "lazy" ? "loading=lazy" : ""} decoding="${DEC}"></span>` : `<span class="av" aria-hidden="true">${initials(name)}</span>`

function chip(m, branch, extra = '') {
  const showTag = m.company && (!branch || branch.kind !== 'company' || m.company !== branch.number)
  const me = m.id === VIEWER ? ' me' : ''
  return `<li class="m${me}" data-id="${m.id}">${avatar(m.name)}<span class="nm">${esc(m.name)}</span>`
    + (showTag ? `<span class="tag">${ORD[m.company]}</span>` : '')
    + (m.acting ? '<span class="b act">Acting</span>' : '')
    + (m.nameMismatch ? '<span class="b warn" title="The display name names a different company than the roles do">Check name</span>' : '')
    + (m.bot ? '<span class="b bot">Bot</span>' : '') + extra + '</li>'
}
const rank = (row, branch) => `<div class="rk" data-rank="${row.rank.key}"><h3 class="rk-l">${esc(row.rank.label)}<span class="n">${row.members.length}</span></h3><ul class="chips">${row.members.map((m) => chip(m, branch)).join('')}</ul></div>`

function ladder(b) { deferImgs = true; const html = ladderInner(b); deferImgs = false; return html }
function ladderInner(b) {
  // items in order: aside (side slot), tier groups (peers share a node), lateral rows (hollow node, dashed stub)
  const items = []
  if (b.aside && b.aside.length) items.push({ type: 'aside' })
  for (const row of b.rows) {
    const last = items[items.length - 1]
    if (row.rank.lateral) items.push({ type: 'lat', rows: [row] })
    else if (last && last.type === 'grp' && last.tier === row.rank.tier) last.rows.push(row)
    else items.push({ type: 'grp', tier: row.rank.tier, rows: [row] })
  }
  const nGrp = items.filter((i) => i.type === 'grp').length || 1
  let gi = 0
  items.forEach((it, s) => {
    it.s = s
    if (it.type === 'grp') { gi++; it.idx = gi }
    it.at = gi // index of the latest group at or before this item
  })
  const lastGrp = items.map((i) => i.type).lastIndexOf('grp')
  return items.map((it, s) => {
    let h, hp, hn, cls = 'rg'
    if (it.type === 'grp') { h = heat(it.idx / nGrp); hp = heat((it.idx - 1) / nGrp); hn = heat(Math.min(1, (it.idx + 1) / nGrp)) }
    else { hp = heat(it.at / nGrp); hn = heat(Math.min(1, (it.at + 1) / nGrp)); h = heat((it.at + 0.5) / nGrp) }
    if (it.type === 'lat') cls += ' lat'
    if (s === items.length - 1 && it.type === 'grp') cls += ' last'
    const style = `--s:${s};--h:${h};--hp:${hp};--hn:${hn}`
    let inner
    if (it.type === 'aside') inner = `<div class="aside rs-aside"><span class="aside-l">Honoured Dreadnoughts</span><ul class="chips">${b.aside.map((m) => chip(m, b)).join('')}</ul></div>`
    else if (it.rows.length > 1) inner = `<div class="peers">${it.rows.map((r) => rank(r, b)).join('')}</div>`
    else inner = rank(it.rows[0], b)
    const heatAttr = it.type === 'lat' ? ' data-lateral' : ''
    return `<div class="${cls}" style="${style}" data-tier="${it.tier ?? ''}"${heatAttr}><i class="node"></i>${inner}</div>`
  }).join('')
}

const count = (b) => (b.head.vacant ? 0 : b.head.members.length) + (b.aside ? b.aside.length : 0) + b.rows.reduce((n, r) => n + r.members.length, 0)

function bar(b, unassigned) {
  const sig = unassigned ? '?' : b.kind === 'company' ? ROMAN[b.number] : SIGIL[b.key]
  const sub = unassigned ? 'No company role' : SUB[b.kind]
  const total = unassigned ? b.rows.reduce((n, r) => n + r.members.length, 0) : count(b)
  const hasBody = unassigned || b.rows.length || (b.aside && b.aside.length)
  let head = ''
  if (!unassigned) {
    const label = `<span class="head-l">${esc(b.head.rank.label)}</span>`
    if (b.head.vacant) head = `${label}<span class="vacant">${ICON_VACANT}Vacant</span>`
    else {
      const ms = b.head.members
      head = label + ms.slice(0, 2).map((m) => `<ul class="chips" style="display:contents">${chip(m, b)}</ul>`).join('')
        + (ms.length > 2 ? `<span class="more">+${ms.length - 2}</span>` : '')
    }
  } else head = ""
  const id = 'body-' + (unassigned ? 'unassigned' : b.key)
  const title = unassigned ? 'Unassigned' : esc(b.label)
  const btn = hasBody
    ? `<button class="bar-btn" type="button" aria-expanded="false" aria-controls="${id}" data-toggle="${unassigned ? 'unassigned' : b.key}"><h2 class="t" style="display:block">${title}</h2></button>`
    : `<div class="bar-btn"><h2 class="t">${title}</h2></div>`
  return `<div class="bar"><span class="sigil" aria-hidden="true">${sig}</span><div>${btn}</div><div class="head rs-head">${head}</div><div class="tail"><span title="${total} members">${total}</span>${ICON_CHEV}</div></div>`
    + (hasBody ? `<div class="body" id="${id}"><div class="body-in"><div class="ladder${unassigned ? ' no-spine' : ''}">${unassigned ? b.rows.map((r) => `<div class="rg" style="padding:.42rem 0"><div class="rk-wrap">${rank(r, null)}</div></div>`).join('') : ladder(b)}</div></div></div>` : '')
}

function summary() {
  const ids = new Set()
  const add = (m) => ids.add(m.id)
  DATA.highCommand.forEach((r) => r.members.forEach(add))
  DATA.branches.forEach((b) => { if (!b.head.vacant) b.head.members.forEach(add); (b.aside || []).forEach(add); b.rows.forEach((r) => r.members.forEach(add)) })
  DATA.unassigned.rows.forEach((r) => r.members.forEach(add))
  const vacant = DATA.branches.filter((b) => b.head.vacant)
  const acting = DATA.branches.filter((b) => b.head.members.some((m) => m.acting))
  const mism = []
  DATA.branches.forEach((b) => { const all = [...(b.head.members || []), ...(b.aside || []), ...b.rows.flatMap((r) => r.members)]; if (all.some((m) => m.nameMismatch)) mism.push(b.key) })
  return { total: ids.size, vacant, acting, mism }
}
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`

function render() {
  const app = document.getElementById('app')
  const s = summary()
  const t = new Date(DATA.fetchedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
  const allOpen = DATA.branches.filter((b) => b.rows.length || (b.aside && b.aside.length)).every((b) => OPEN.has(b.key))
  const link = (k, txt) => `<a href="#${k}" data-jump="${k}">${txt}</a>`
  const stat = [`<li>${s.total} on the roll</li>`]
  if (s.vacant.length) stat.push(`<li>${link(s.vacant[0].key, plural(s.vacant.length, 'vacant post', 'vacant posts'))}</li>`)
  if (s.acting.length) stat.push(`<li>${link(s.acting[0].key, plural(s.acting.length, 'acting head', 'acting heads'))}</li>`)
  if (s.mism.length) stat.push(`<li>${link(s.mism[0], plural(s.mism.length, 'branch with a name to check', 'branches with names to check'))}</li>`)
  stat.push(`<li class="when">Updated ${t}</li>`)

  const hc = DATA.highCommand
  const hero = hc[0]
  const heroHtml = hero ? `<div><p class="dais-label">High Command</p><div class="hero"><span class="av" aria-hidden="true">${initials(hero.members[0].name)}</span><div><div class="hero-rank">${esc(hero.rank.label)}</div><div class="hero-name">${esc(hero.members[0].name)}</div></div></div></div>` : ''
  const court = `<div class="court">${hc.slice(1).map((r) => rank(r, null)).join('')}</div>`

  app.innerHTML = `
    <p class="eyebrow">XVIII Legion</p>
    <h1>Order of Battle</h1>
    <p class="lede">Who leads what, read live from Discord roles. Open a branch to see its ranks.</p>
    <ul class="status">${stat.join('')}</ul>
    <div class="actions">
      <button class="btn find" type="button" id="find">${ICON_FIND}Find me</button>
      <button class="btn" type="button" id="all">${allOpen ? 'Collapse all' : 'Expand all'}</button>
      <span class="spacer"></span>
      <button class="btn" type="button" id="inf" aria-pressed="${showInf}">Infirmary</button>
    </div>
    <p class="findmsg" id="findmsg" role="status"></p>
    ${showInf ? infirmary() : `
    <section class="dais surface rs-high-command" aria-label="High Command">${heroHtml}${court}</section>
    <div class="branches rs-branches">${DATA.branches.map((b) => `<article class="branch surface rs-branch" id="${b.key}" data-branch="${b.key}" data-kind="${b.kind}"${OPEN.has(b.key) ? ' data-open' : ''}${(b.rows.length || (b.aside && b.aside.length)) ? '' : ' data-static'}>${bar(b)}</article>`).join('')}
      ${DATA.unassigned.rows.length ? `<article class="branch surface rs-unassigned" id="unassigned" data-branch="unassigned"${OPEN.has('unassigned') ? ' data-open' : ''}>${bar(DATA.unassigned, true)}</article>` : ''}
    </div>
    <section class="srv rs-servitors" aria-label="Servitors"><h2>Servitors</h2><ul class="chips">${DATA.servitors.map((m) => chip(m, null)).join('')}</ul></section>`}
  `
  syncOpen()
}
function infirmary() {
  return `<section class="inf surface rs-infirmary"><h2>Infirmary</h2><p class="sub">${INF.count} on leave</p>${INF.members.map((m) => `<div class="inf-row" data-id="${m.id}">${m.rank ? `<span class="rk-r">${esc(m.rank.label)}</span>` : ''}<ul class="chips">${chip(m, null, m.legion ? '<span class="b warn">Still holds the Legion role</span>' : '')}</ul></div>`).join('')}</section>`
}
function syncOpen() {
  document.querySelectorAll('.branch').forEach((el) => {
    const key = el.dataset.branch, open = OPEN.has(key)
    el.toggleAttribute('data-open', open)
    const btn = el.querySelector('[data-toggle]'); if (btn) btn.setAttribute('aria-expanded', open)
    const body = el.querySelector('.body'); if (body) body.inert = !open
    if (open) el.querySelectorAll('img[data-src]').forEach((i) => { i.src = i.dataset.src; i.removeAttribute('data-src') })
  })
}
function toggle(key, force) {
  const open = force ?? !OPEN.has(key)
  open ? OPEN.add(key) : OPEN.delete(key)
  syncOpen()
  const all = document.getElementById('all')
  const openable = [...document.querySelectorAll('.branch[data-toggle], .branch:not([data-static])')]
  if (all) all.textContent = [...document.querySelectorAll('.branch:not([data-static])')].every((el) => OPEN.has(el.dataset.branch)) ? 'Collapse all' : 'Expand all'
}
function jump(key) {
  const el = document.getElementById(key); if (!el) return
  el.scrollIntoView({ behavior: 'smooth', block: 'center' })
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash')
}
const settle = () => requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove("instant")))
// open with no height animation, so a scroll target measured right after is exact
function openNow(key) { document.documentElement.classList.add("instant"); toggle(key, true); void document.body.offsetHeight; settle() }
// run a bulk change without moving what the reader is looking at
function pinned(mutate) {
  const list = [...document.querySelectorAll(".branch")]
  // the branch under the reader's eye (a line about a third of the way down), else the nearest one
  const line = innerHeight * 0.35
  const at = (b) => { const r = b.getBoundingClientRect(); return r.top <= line && r.bottom > line ? 0 : Math.min(Math.abs(r.top - line), Math.abs(r.bottom - line)) }
  const ref = list.reduce((best, b) => (at(b) < at(best) ? b : best), list[0])
  const want = Math.min(Math.max(ref.getBoundingClientRect().top, 90), innerHeight * 0.6)
  document.documentElement.classList.add("instant")
  mutate()
  scrollBy({ top: ref.getBoundingClientRect().top - want, behavior: "instant" })
  settle()
}
function findMe() {
  const msg = document.getElementById('findmsg'); msg.textContent = ''
  const chips = [...document.querySelectorAll(`.branch [data-id="${VIEWER}"]`)]
  if (!chips.length) { msg.textContent = 'You are not on the roll. Check your Legion and rank roles in Discord.'; return }
  const chipEl = chips[0], branch = chipEl.closest('.branch')
  openNow(branch.dataset.branch)
  chipEl.scrollIntoView({ behavior: 'smooth', block: 'center' })
  chipEl.classList.remove('ping'); void chipEl.offsetWidth; chipEl.classList.add('ping')
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-toggle]'); if (t) return toggle(t.dataset.toggle)
  const j = e.target.closest('[data-jump]'); if (j) { e.preventDefault(); openNow(j.dataset.jump); jump(j.dataset.jump) }
  if (e.target.closest('#find')) findMe()
  if (e.target.closest('#all')) {
    const els = [...document.querySelectorAll('.branch:not([data-static])')]
    const everyOpen = els.every((el) => OPEN.has(el.dataset.branch))
    pinned(() => {
      els.forEach((el) => (everyOpen ? OPEN.delete(el.dataset.branch) : OPEN.add(el.dataset.branch)))
      syncOpen(); document.getElementById('all').textContent = everyOpen ? 'Expand all' : 'Collapse all'
    })
  }
  if (e.target.closest('#inf')) { showInf = !showInf; render() }
})

fetch('fixture.json').then((r) => r.json()).then((f) => {
  DATA = f.roster; INF = f.infirmary
  // mock-only: give company 1 a Champion beside its Ancient, to show same-tier peers side by side
  const c1 = DATA.branches[0], i = c1.rows.findIndex((r) => r.rank.key === 'company-ancient')
  c1.rows.splice(i + 1, 0, { rank: { key: 'company-champion', label: 'Company Champion', tier: 2 }, members: [{ id: '900000000000009001', name: 'Sextus Vael', avatar: null, company: 1 }] })
  // mock-only: the viewer is a Battle-Brother of the 3rd
  VIEWER = DATA.branches[2].rows.find((r) => r.rank.key === 'battle-brother').members[2].id
  const h = location.hash.slice(1); if (h) OPEN.add(h)
  render()
  if (h) setTimeout(() => jump(h), 200)
})
</script>
