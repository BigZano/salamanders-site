<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hero drawing mock</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #020403;
        color: #c3d0c6;
        font: 12px/1.4 ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }
      body {
        display: grid;
        grid-template-columns: 168px minmax(0, 1fr);
      }
      body.bare {
        grid-template-columns: minmax(0, 1fr);
      }
      body.bare #rail {
        display: none;
      }
      #rail {
        padding: 10px;
        border-right: 1px solid #26372f;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #rail h2 {
        margin: 6px 0 2px;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7a8a81;
        font-weight: 400;
      }
      .row {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        color: #c3d0c6;
        background: #0b1511;
        border: 1px solid #26372f;
        border-radius: 2px;
        padding: 5px 8px;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        color: #1a0d06;
        background: #ff6a2b;
        border-color: #ffb066;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      input[type='range'] {
        width: 100%;
      }
      label.tune {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 6px;
        margin: 4px 0;
        cursor: default;
      }
      label.tune input {
        grid-column: 1 / -1;
      }
      label.tune output {
        color: #ffb066;
      }
      #tune-out {
        color: #7a8a81;
        font-size: 11px;
        white-space: pre-wrap;
        margin: 6px 0 0;
      }
      #stage {
        position: relative;
        overflow: hidden;
        display: grid;
        place-items: start center;
      }
      #frame {
        border: 0;
        background: #050a08;
        transform-origin: top center;
      }
      #note {
        color: #7a8a81;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <aside id="rail">
      <h2>Drawing</h2>
      <div class="row" id="modes">
        <button data-mode="live">Live</button>
        <button data-mode="mock">Mock</button>
      </div>
      <h2>Peak</h2>
      <div class="row" id="comps">
        <button data-comp="a">A as live</button>
        <button data-comp="b">B clear of title</button>
      </div>
      <h2>Lava fire</h2>
      <div class="row" id="pals">
        <button data-pal="forge">Forge blend</button>
        <button data-pal="molten">Molten</button>
        <button data-pal="doom">Doom raw</button>
      </div>
      <h2>Width</h2>
      <div class="row" id="sizes">
        <button data-size="full">Full</button>
        <button data-size="1200">1200</button>
        <button data-size="768">768</button>
        <button data-size="390">390</button>
      </div>
      <h2>Phone</h2>
      <div class="row" id="phones">
        <button data-phone="roof">Roof</button>
        <button data-phone="stack">Stack</button>
      </div>
      <h2>Inner pages</h2>
      <div class="row" id="inners">
        <button data-inner="left">Left as home</button>
        <button data-inner="right">Mirrored right</button>
      </div>
      <h2>Tuner</h2>
      <div id="tuner"></div>
      <div class="row">
        <button id="tune-reset">Reset tuner</button>
      </div>
      <pre id="tune-out"></pre>
      <h2>Mock layers</h2>
      <div id="layers"></div>
      <h2>Moon across the sky</h2>
      <input id="moon" type="range" min="0" max="1" step="0.01" />
      <h2>Time</h2>
      <div class="row">
        <button id="freeze">Freeze</button>
        <button id="erupt">Erupt</button>
      </div>
      <p id="note"></p>
    </aside>
    <main id="stage"><iframe id="frame" title="The real page"></iframe></main>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
