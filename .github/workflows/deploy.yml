name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          # Repo variable (Settings > Secrets and variables > Actions >
          # Variables), not a secret — it ends up in the public JS bundle
          # either way. Unset for now: falls back to buildsApi.js's
          # localhost:8787 default, which only works for local dev. Set this
          # once the server/ stack has a real public address and re-run this
          # workflow (workflow_dispatch or a push) to pick it up.
          VITE_BUILDS_API_URL: ${{ vars.VITE_BUILDS_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
