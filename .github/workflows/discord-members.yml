name: Sync Discord member list

# Bakes the guild's member-role list to src/data/discord-members.json so the
# site can badge member-submitted builds with no live OAuth/backend check.
# Unlike the weekly wiki data sync, this commits straight to main — a role
# roster diff isn't something worth a PR review, and it's just membership
# data, not app code.

on:
  schedule:
    - cron: '0 */8 * * *' # every 8 hours
  workflow_dispatch:
  repository_dispatch:
    types: [build-submitted]

permissions:
  contents: write

concurrency:
  group: discord-members
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner image ships Node 22.23.3, which predates the Brotli decoder fix (CVE-2026-111497,
      # "Node2Shell"; patched in 22.23.4). A bare `22` would match that cached copy, so ask for a floor
      # the cache can't satisfy and let setup-node download the current 22.x. This job's `node` holds
      # the Discord bot token while it reads a response from the network.
      - uses: actions/setup-node@v4
        with:
          node-version: '>=22.23.4 <23'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Fetch member list
        run: bun run discord:members
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_ROLE_VERIFIER }}

      - name: Commit if changed
        env:
          # `bun install` installs husky here, so `git push` would run the repo's pre-push gate (suite plus a
          # ~7 minute mutation run) for what is only a data file. That stretched this job's window until a
          # person's push to main landed first and this one was rejected. Skip the gate for this data-only commit.
          HUSKY: '0'
        run: |
          if [ -z "$(git status --porcelain -- src/data/discord-members.json)" ]; then
            echo "No membership changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/discord-members.json
          git commit -m 'data: sync Discord member-role list'
          # main may have moved since checkout: rebase onto it, and try once more if it moves again.
          for attempt in 1 2; do
            git pull --rebase origin main && git push && exit 0
          done
          exit 1
