    <script>
      // Undoes the encoding public/404.html applies for a deep-link reload —
      // must run before router.js constructs createWebHistory(), which reads
      // location.pathname immediately. See 404.html for the other half.
      ;(function () {
        var redirect = new URLSearchParams(location.search).get('redirect')
        if (redirect) history.replaceState(null, '', redirect)
      })()
    </script>
